{% if apps %}
<div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
    {% for app in apps %}
        {% include "base/components/app_card.html" %}
    {% endfor %}
</div>
{% else %}
<div class="text-center py-12">
    <div class="max-w-md mx-auto">
        <svg class="w-24 h-24 mx-auto text-base-content/20 mb-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10"></path>
        </svg>
        <h3 class="text-lg font-semibold mb-2">No Applications Found</h3>
        <p class="text-base-content/70 mb-4">Get started by deploying your first application.</p>
        <button class="btn btn-primary" 
                hx-get="/apps/deploy" 
                hx-target="#main-content"
                hx-push-url="true">
            Deploy Your First App
        </button>
    </div>
</div>
{% endif %}
