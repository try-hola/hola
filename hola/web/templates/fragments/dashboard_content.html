<!-- Dashboard Content Fragment -->
<div class="space-y-6">
    <!-- Page Header -->
    <div class="flex justify-between items-center">
        <div>
            <h1 class="text-3xl font-bold">Dashboard</h1>
            <p class="text-base-content/70 mt-1">Overview of your deployed applications</p>
        </div>
        <button class="btn btn-primary" 
                hx-get="/apps/deploy" 
                hx-target="#main-content"
                hx-push-url="true">
            <svg class="w-5 h-5 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path>
            </svg>
            Deploy New App
        </button>
    </div>

    <!-- Stats Cards -->
    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6">
        <div class="stat bg-base-100 shadow rounded-lg">
            <div class="stat-figure text-primary">
                <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10"></path>
                </svg>
            </div>
            <div class="stat-title">Total Apps</div>
            <div class="stat-value text-primary">{{ stats.total_apps }}</div>
        </div>

        <div class="stat bg-base-100 shadow rounded-lg">
            <div class="stat-figure text-success">
                <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path>
                </svg>
            </div>
            <div class="stat-title">Running</div>
            <div class="stat-value text-success">{{ stats.running_apps }}</div>
        </div>

        <div class="stat bg-base-100 shadow rounded-lg">
            <div class="stat-figure text-error">
                <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 14l2-2m0 0l2-2m-2 2l-2-2m2 2l2 2m7-2a9 9 0 11-18 0 9 9 0 0118 0z"></path>
                </svg>
            </div>
            <div class="stat-title">Stopped</div>
            <div class="stat-value text-error">{{ stats.stopped_apps }}</div>
        </div>

        <div class="stat bg-base-100 shadow rounded-lg">
            <div class="stat-figure text-warning">
                <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path>
                </svg>
            </div>
            <div class="stat-title">Issues</div>
            <div class="stat-value text-warning">{{ stats.issues }}</div>
        </div>
    </div>

    <!-- Recent Applications -->
    <div class="card bg-base-100 shadow-xl">
        <div class="card-body">
            <div class="flex justify-between items-center mb-4">
                <h2 class="card-title">Recent Applications</h2>
                <a href="/apps" 
                   hx-get="/apps" 
                   hx-target="#main-content" 
                   hx-push-url="true"
                   class="btn btn-ghost btn-sm">
                    View All
                </a>
            </div>
            
            <div id="recent-apps" 
                 hx-get="/api/apps/recent" 
                 hx-target="#recent-apps" 
                 hx-trigger="load, every 30s">
                <!-- Recent apps will be loaded here -->
                <div class="flex justify-center items-center py-8">
                    <div class="loading loading-spinner loading-md"></div>
                </div>
            </div>
        </div>
    </div>

    <!-- System Status -->
    <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
        <div class="card bg-base-100 shadow-xl">
            <div class="card-body">
                <h2 class="card-title">System Resources</h2>
                <div id="system-metrics" 
                     hx-get="/api/metrics/system" 
                     hx-target="#system-metrics" 
                     hx-trigger="load, every 10s">
                    <!-- System metrics will be loaded here -->
                    <div class="flex justify-center items-center py-8">
                        <div class="loading loading-spinner loading-md"></div>
                    </div>
                </div>
            </div>
        </div>

        <div class="card bg-base-100 shadow-xl">
            <div class="card-body">
                <h2 class="card-title">Recent Activity</h2>
                <div id="recent-activity" 
                     hx-get="/api/activity/recent" 
                     hx-target="#recent-activity" 
                     hx-trigger="load, every 30s">
                    <!-- Activity log will be loaded here -->
                    <div class="flex justify-center items-center py-8">
                        <div class="loading loading-spinner loading-md"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
