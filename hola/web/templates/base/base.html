<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Hola{% endblock %} | Application Deployment Platform</title>
    
    <!-- DaisyUI CSS -->
    <link href="https://cdn.jsdelivr.net/npm/daisyui@4.12.14/dist/full.min.css" rel="stylesheet" type="text/css" />
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- HTMX -->
    <script src="https://unpkg.com/htmx.org@2.0.4"></script>
    <script src="https://unpkg.com/htmx-ext-sse@2.2.2/sse.js"></script>
    
    <!-- Custom styles -->
    <link rel="stylesheet" href="{{ url_for('static', path='/css/custom.css') }}">
    
    {% block head %}{% endblock %}
</head>
<body>
    <div class="min-h-screen bg-base-200">
        <!-- Navigation -->
        <div class="navbar bg-base-100 shadow-lg">
            <div class="navbar-start">
                <div class="dropdown">
                    <div tabindex="0" role="button" class="btn btn-ghost lg:hidden">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h8m-8 6h16"></path>
                        </svg>
                    </div>
                    <ul tabindex="0" class="menu menu-sm dropdown-content mt-3 z-[1] p-2 shadow bg-base-100 rounded-box w-52">
                        <li><a href="/" hx-get="/" hx-target="#main-content" hx-push-url="true">Dashboard</a></li>
                        <li><a href="/apps" hx-get="/apps" hx-target="#main-content" hx-push-url="true">Applications</a></li>
                        <li><a href="/settings" hx-get="/settings" hx-target="#main-content" hx-push-url="true">Settings</a></li>
                    </ul>
                </div>
                <a class="btn btn-ghost text-xl" href="/" hx-get="/" hx-target="#main-content" hx-push-url="true">
                    <span class="text-primary font-bold">Hola</span>
                </a>
            </div>
            <div class="navbar-center hidden lg:flex">
                <ul class="menu menu-horizontal px-1">
                    <li><a href="/" hx-get="/" hx-target="#main-content" hx-push-url="true" class="{% block nav_dashboard %}{% endblock %}">Dashboard</a></li>
                    <li><a href="/apps" hx-get="/apps" hx-target="#main-content" hx-push-url="true" class="{% block nav_apps %}{% endblock %}">Applications</a></li>
                    <li><a href="/settings" hx-get="/settings" hx-target="#main-content" hx-push-url="true" class="{% block nav_settings %}{% endblock %}">Settings</a></li>
                </ul>
            </div>
            <div class="navbar-end">
                <div class="dropdown dropdown-end">
                    <div tabindex="0" role="button" class="btn btn-ghost btn-circle avatar">
                        <div class="w-10 rounded-full bg-primary text-primary-content flex items-center justify-center">
                            <span class="text-sm font-bold">U</span>
                        </div>
                    </div>
                    <ul tabindex="0" class="mt-3 z-[1] p-2 shadow menu menu-sm dropdown-content bg-base-100 rounded-box w-52">
                        <li><a>Profile</a></li>
                        <li><a>Settings</a></li>
                        <li><a>Logout</a></li>
                    </ul>
                </div>
            </div>
        </div>

        <!-- Main content -->
        <main class="container mx-auto px-4 py-6">
            <div id="main-content">
                {% block content %}{% endblock %}
            </div>
        </main>

        <!-- Global notifications -->
        <div id="notifications" class="toast toast-top toast-end">
            <!-- Notifications will be inserted here -->
        </div>
    </div>

    <!-- Global loading indicator -->
    <div id="global-loading" class="htmx-indicator">
        <div class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50">
            <div class="loading loading-spinner loading-lg text-primary"></div>
        </div>
    </div>

    {% block scripts %}{% endblock %}
</body>
</html>
