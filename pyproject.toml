[tool.poetry]
name = "hola"
version = "0.1.0"
description = "Hola application deployment platform - FastAPI server with HTMX/DaisyUI web interface"
authors = ["Your Name <your.email@example.com>"]
packages = [
    { include = "hola" }
]

[tool.poetry.dependencies]
python = "^3.10"
# FastAPI and server dependencies
fastapi = "^0.115.12"
uvicorn = "^0.34.2"
python-multipart = "^0.0.20"
# Template engine for web interface
jinja2 = "^3.1.4"
# Pydantic for data models
pydantic = "^2.11.4"
pydantic-settings = "^2.9.1"
# System monitoring
psutil = "^7.0.0"
# Server-Sent Events for real-time updates
sse-starlette = "^2.1.5"

[tool.poetry.group.dev.dependencies]
pytest = "^8.3.5"
pytest-cov = "^6.1.1"
pytest-asyncio = "^0.26.0"
pytest-watch = "^4.2.0"
httpx = "^0.27.0"  # For FastAPI TestClient
pydantic-factories = "^1.17.3"
polyfactory = "^2.21.0"
black = "^25.1.0"
isort = "^6.0.1"
requests = "^2.32.3"
[tool.poetry.scripts]
hola = "hola.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests", "integration_tests"]
python_files = "test_*.py"
python_functions = "test_*"
pythonpath = ["."]
markers = [
    "integration: marks tests as integration tests (select with -m integration)",
    "unit: marks tests as unit tests (select with -m unit)"
]
asyncio_mode = "strict"
asyncio_default_fixture_loop_scope = "function"

[tool.black]
line-length = 88
target-version = ['py310']

[tool.isort]
profile = "black"
line_length = 88

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"