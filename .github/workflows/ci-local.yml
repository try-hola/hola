name: CI (Local Testing)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.1.34

      - name: Install
        run: bun install

      - name: Lint
        run: bun run lint

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        env:
          HOLA_ENABLE_DEV_API: "true"
          HOLA_USE_REAL_DOCKER: "false"
        run: bun run test

      - name: Build web
        run: bun --cwd packages/web run build