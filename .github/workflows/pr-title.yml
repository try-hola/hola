name: PR Title

# Enforce Conventional Commit PR titles. The repo squash-merges, so the PR title
# becomes the commit subject on `main` — keeping it conventional keeps history and
# any generated changelog clean. See https://www.conventionalcommits.org/
on:
  pull_request_target:
    types: [ opened, edited, synchronize, reopened ]

permissions:
  pull-requests: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Validate PR title
        uses: amannn/action-semantic-pull-request@e32d7e603df1aa1ba07e981f2a23455dee596825 # v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
