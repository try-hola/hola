name: Tests (Bun Monorepo)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.1.34

      - name: Install dependencies
        run: bun install

      - name: Lint
        run: bun run lint

      - name: Typecheck
        run: bun run typecheck

      - name: Start server in background
        run: |
          cd packages/server
          nohup bun run dev > server.log 2>&1 & echo $! > ../..//server.pid

      - name: Wait for server healthz
        run: |
          for i in {1..60}; do
            if curl -sSf http://localhost:3001/healthz > /dev/null; then
              echo "Server is healthy";
              exit 0;
            fi;
            echo "Waiting for server... ($i)";
            sleep 1;
          done;
          echo "Server failed to become healthy in time";
          echo "==== server.log (last 200 lines) ====";
          tail -n 200 packages/server/server.log || true;
          exit 1

      - name: Run tests across packages
        env:
          HOLA_ENABLE_DEV_API: "true"
          HOLA_USE_REAL_DOCKER: "false"
        run: bun run --filter './packages/*' test

      - name: Run server contract tests
        run: |
          cd packages/server
          bun test

      - name: Upload server logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: server-logs
          path: |
            packages/server/server.log
            server.pid

      - name: Stop background server
        if: always()
        run: |
          if [ -f server.pid ]; then
            kill $(cat server.pid) || true;
            rm -f server.pid;
          fi
