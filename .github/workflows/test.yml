name: Tests (Bun Monorepo)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.1.34

      - name: Install dependencies
        run: bun install

      - name: Lint
        run: bun run lint

      - name: Typecheck
        run: bun run typecheck

      - name: Run web and cli tests
        env:
          HOLA_ENABLE_DEV_API: "true"
          HOLA_USE_REAL_DOCKER: "false"
        run: |
          bun run --filter './packages/web' test
          bun run --filter './packages/cli' test

      - name: Run server contract tests
        run: |
          cd packages/server
          bun test

      - name: Upload server logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: server-logs
          path: |
            packages/server/server.log
            server.pid
          if-no-files-found: ignore
