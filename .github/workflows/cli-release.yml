name: CLI Release

# On a `cli-v*` tag, build the release artifacts that all track the same version:
#   1. multi-arch server + web images, pushed to GHCR (ghcr.io/try-hola/{server,web})
#   2. the compose bundle tarball (hola-compose-<version>.tar.gz)
#   3. standalone `hola` CLI binaries
# (2) and (3) are attached to the GitHub Release; the host downloads (2) and
# `docker compose up` pulls the pinned images from (1) — no build on the host.
#
# Trigger by pushing a tag like `cli-v0.1.0`:
#   git tag cli-v0.1.0 && git push origin cli-v0.1.0
#
# ONE-TIME SETUP: GHCR packages are created private. After the first run, set
# `ghcr.io/try-hola/server` and `ghcr.io/try-hola/web` to Public in the org's
# package settings so hosts pull them without authentication.
on:
  push:
    tags:
      - 'cli-v*'

permissions:
  contents: write
  packages: write

jobs:
  # 1) Build + push the version-pinned platform images to GHCR.
  images:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Resolve version
        id: ver
        run: |
          VERSION="${GITHUB_REF_NAME#cli-v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          # A pre-release version (e.g. 0.5.0-rc.1) must not move the :latest tag —
          # only stable releases become the default a fresh `docker compose up` pulls.
          if [[ "$VERSION" == *-* ]]; then
            echo "server_tags=ghcr.io/try-hola/server:$VERSION" >> "$GITHUB_OUTPUT"
            echo "web_tags=ghcr.io/try-hola/web:$VERSION" >> "$GITHUB_OUTPUT"
          else
            echo "server_tags=ghcr.io/try-hola/server:$VERSION,ghcr.io/try-hola/server:latest" >> "$GITHUB_OUTPUT"
            echo "web_tags=ghcr.io/try-hola/web:$VERSION,ghcr.io/try-hola/web:latest" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push server image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: packages/server/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.ver.outputs.server_tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & push web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: packages/web/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.ver.outputs.web_tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # 2) Compose bundle + CLI binaries, attached to the Release. Runs after the
  #    images so the published Release only ever points at images that exist.
  release:
    needs: images
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      - name: Install
        run: bun install --frozen-lockfile

      - name: Resolve version
        id: ver
        run: |
          VERSION="${GITHUB_REF_NAME#cli-v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          # Pre-release versions (e.g. 0.5.0-rc.1) are published as GitHub prereleases.
          [[ "$VERSION" == *-* ]] && echo "prerelease=true" >> "$GITHUB_OUTPUT" || echo "prerelease=false" >> "$GITHUB_OUTPUT"

      - name: Compile binaries (cross-target)
        run: |
          mkdir -p dist-bin
          for t in linux-x64 linux-arm64 darwin-x64 darwin-arm64; do
            echo "Building hola-$t"
            bun build packages/cli/src/index.ts --compile \
              --target="bun-$t" \
              --outfile "dist-bin/hola-$t"
          done
          ls -lh dist-bin

      - name: Package compose bundle
        run: |
          VERSION="${{ steps.ver.outputs.version }}"
          # Stamp the version so scripts/_common.sh pins the image tags on the host.
          printf '%s\n' "$VERSION" > packages/compose/VERSION
          mkdir -p dist-bin
          tar czf "dist-bin/hola-compose-$VERSION.tar.gz" -C packages/compose \
            --exclude=./node_modules --exclude=./data --exclude=./logs \
            --exclude=./traefik --exclude=./.env .
          ls -lh dist-bin

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Create the release if it does not exist, then upload (clobbering) the assets.
          if ! gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            # Auto-generate a PR-based changelog, anchored at the last STABLE
            # (non-rc) release so a release's notes cover the WHOLE range since the
            # previous stable. Without an explicit start tag, GitHub diffs against
            # the immediately preceding tag — usually the last rc — so a
            # stable→stable upgrader (and `hola update`, which prints this body)
            # would only see the final hop and miss everything the rc's introduced.
            # The changelog goes FIRST, followed by a sentinel comment and the
            # install snippet: `hola update` prints everything up to the sentinel.
            PREV_STABLE="$(gh api "repos/${GITHUB_REPOSITORY}/releases?per_page=100" \
              -q "[.[] | select(.prerelease==false) | .tag_name] | map(select(. != \"$GITHUB_REF_NAME\")) | .[0] // empty" 2>/dev/null || true)"
            PREV_ARGS=()
            if [ -n "$PREV_STABLE" ]; then PREV_ARGS=(-f "previous_tag_name=$PREV_STABLE"); fi
            CHANGELOG="$(gh api "repos/${GITHUB_REPOSITORY}/releases/generate-notes" \
              -f tag_name="$GITHUB_REF_NAME" "${PREV_ARGS[@]}" -q .body 2>/dev/null || true)"
            {
              if [ -n "$CHANGELOG" ]; then printf '%s\n\n' "$CHANGELOG"; fi
              printf '<!-- hola:changelog-end -->\n'
              printf 'Standalone `hola` CLI binaries. Install with:\n'
              printf '```\n'
              printf 'curl -fsSL https://raw.githubusercontent.com/%s/main/cli-install.sh | sh\n' "$GITHUB_REPOSITORY"
              printf '```\n'
            } > release-notes.md
            gh release create "$GITHUB_REF_NAME" \
              ${{ steps.ver.outputs.prerelease == 'true' && '--prerelease' || '' }} \
              --title "Hola CLI $GITHUB_REF_NAME" \
              --notes-file release-notes.md
          fi
          gh release upload "$GITHUB_REF_NAME" dist-bin/hola-* --clobber
