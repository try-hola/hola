# Dependabot keeps this repo's dependencies current. Note the split with the
# catalog: try-hola/apps uses **Renovate** for upstream app image pins; this repo
# (the server/web/CLI Bun monorepo) uses **Dependabot** for its npm workspace,
# GitHub Actions, and container base images. Weekly cadence + grouped minor/patch
# updates keep PR volume low; majors arrive individually for scrutiny.
version: 2
updates:
  # JS/TS dependencies across the Bun workspace. The root bun.lock covers every
  # packages/* workspace, so a single "/" entry updates them all.
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
    # Let a new release settle before Dependabot opens a PR for it — avoids churn
    # from versions that get yanked or immediately patched.
    cooldown:
      default-days: 7
    commit-message:
      prefix: "chore(deps)"
      prefix-development: "chore(deps-dev)"
      include: "scope"
    groups:
      npm-minor-patch:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  # Actions used by CI (ci-bun, ci-local) and the release workflow (cli-release).
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    labels:
      - "dependencies"
    cooldown:
      default-days: 7
    commit-message:
      prefix: "chore(ci)"
    groups:
      github-actions:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  # Base images for the server + web container builds.
  - package-ecosystem: "docker"
    directories:
      - "/packages/server"
      - "/packages/web"
    schedule:
      interval: "weekly"
      day: "monday"
    labels:
      - "dependencies"
    cooldown:
      default-days: 7
    commit-message:
      prefix: "chore(docker)"

  # The Tailscale companion image the server injects for private ingress
  # (spec 010). packages/server/platform-images/tailscale/Dockerfile is never
  # built: it is a one-line pin file the server imports as text, so a bump here
  # changes what the server runs with no second edit. Its own entry, label and
  # prefix (never grouped with the base images above) because a new Tailscale
  # release can change CLI flags the server passes. Check a bump against the
  # real-Docker integration test before merging; CI does not run it. See
  # docs/TAILSCALE_INGRESS.md, "Updating the companion image".
  - package-ecosystem: "docker"
    directory: "/packages/server/platform-images/tailscale"
    schedule:
      interval: "weekly"
      day: "monday"
    labels:
      - "dependencies"
      - "tailscale-companion"
    cooldown:
      default-days: 7
    commit-message:
      prefix: "chore(tailscale)"
