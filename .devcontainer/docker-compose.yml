version: "3.8"
services:
  devcontainer:
    image: mcr.microsoft.com/devcontainers/typescript-node:latest
    user: node
    volumes:
      - ..:/workspaces/hola:cached
    command: sleep infinity
    environment:
      NODE_ENV: development
    ports:
      - "3000:3000"
    networks:
      - devnet
    depends_on:
      - openwebui

  openwebui:
    image: ghcr.io/open-webui/open-webui:main
    ports:
      - "3001:8080"
    environment:
      - OLLAMA_BASE_URL=http://host.docker.internal:11434
      - WEBUI_AUTH=False
    networks:
      - devnet

networks:
  devnet:
    driver: bridge
