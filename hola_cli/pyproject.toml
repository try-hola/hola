[tool.poetry]
name = "hola_cli"
version = "0.1.0"
description = "Hola CLI client (Typer)"
authors = ["Your Name <your.email@example.com>"]

[tool.poetry.dependencies]
python = "^3.10"
typer = "^0.15.3"
rich = "^14.0.0"
hola_shared = {path = "../hola_shared"}
hola_client_sdk = {path = "../hola_client_sdk"}

[tool.poetry.group.dev.dependencies]
pytest = "^8.3.5"
pytest-cov = "^6.1.1"
pytest-mock = "^3.14.0"
pytest-watch = "^4.2.0"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"