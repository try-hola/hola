# Hola production stack: Traefik (ingress/TLS) + web (SPA, single origin) + API server.
#
# The API server orchestrates app deployments via the Docker socket and emits
# Traefik dynamic configuration into its data volume, which Traefik reads through
# its file provider, so deployed apps become routable at <app>.<HOLA_BASE_DOMAIN>.
#
#   cp .env.example .env   # then edit
#   ./scripts/install.sh   # or: docker compose -f docker-compose.yml up -d --build
#
# This is the PRODUCTION stack. For local development use the dev override:
#   HOLA_DEV=1 ./scripts/up.sh
#   # or: docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d

services:
  traefik:
    image: traefik:v3.1
    container_name: traefik
    restart: unless-stopped
    command:
      - --api.dashboard=true
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      # App routes emitted by the Hola server land here (shared data volume).
      - --providers.file.directory=/data/runtime/traefik
      - --providers.file.watch=true
      - --entrypoints.web.address=:80
      - --entrypoints.websecure.address=:443
      # Default cert resolver for HTTPS so server-emitted app routes (Traefik
      # file provider, which set `tls: {}` without a resolver) get Let's Encrypt
      # certificates automatically — every deployed app at <app>.<base-domain>
      # is served over valid TLS, not Traefik's self-signed default.
      - --entrypoints.websecure.http.tls.certresolver=le
      # Global HTTP -> HTTPS redirect at the entrypoint (no per-service middleware).
      - --entrypoints.web.http.redirections.entrypoint.to=websecure
      - --entrypoints.web.http.redirections.entrypoint.scheme=https
      # Let's Encrypt (HTTP-01). Requires public, resolvable domains.
      - --certificatesresolvers.le.acme.email=${LETSENCRYPT_EMAIL}
      - --certificatesresolvers.le.acme.storage=/letsencrypt/acme.json
      - --certificatesresolvers.le.acme.httpchallenge=true
      - --certificatesresolvers.le.acme.httpchallenge.entrypoint=web
    ports:
      - "${TRAEFIK_HTTP_PORT:-80}:80"
      - "${TRAEFIK_HTTPS_PORT:-443}:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - hola-data:/data:ro
      - ./traefik/acme:/letsencrypt
    labels:
      traefik.enable: "true"
      traefik.http.routers.traefik.rule: Host(`${TRAEFIK_DASHBOARD_DOMAIN}`)
      traefik.http.routers.traefik.entrypoints: websecure
      traefik.http.routers.traefik.service: api@internal
      traefik.http.routers.traefik.tls: "true"
      traefik.http.routers.traefik.tls.certresolver: le

  server:
    image: hola/server:latest
    build:
      context: ../..
      dockerfile: packages/server/Dockerfile
    container_name: hola-server
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - HOLA_DATA_DIR=/data
      - HOLA_USE_AUTH=${HOLA_USE_AUTH:-true}
      # Optional fixed admin key; if unset, the server generates one on first boot
      # and writes it to /data/config/admin-api-key (see README).
      - HOLA_API_KEY=${HOLA_API_KEY:-}
      # Base domain that deployed apps are exposed under (e.g. gitea.${HOLA_BASE_DOMAIN}).
      - HOLA_BASE_DOMAIN=${HOLA_BASE_DOMAIN:-local.hola}
    volumes:
      # Orchestrate deployments by talking to the host Docker engine.
      # SECURITY: this grants control of the host's Docker - see README.
      - /var/run/docker.sock:/var/run/docker.sock
      - hola-data:/data
    # Internal only: reached through the web container's /api proxy, not exposed by Traefik.
    labels:
      traefik.enable: "false"

  web:
    image: hola/web:latest
    build:
      context: ../..
      dockerfile: packages/web/Dockerfile
    container_name: hola-web
    restart: unless-stopped
    depends_on:
      - server
    labels:
      traefik.enable: "true"
      traefik.http.routers.hola-web.rule: Host(`${HOLA_DOMAIN}`)
      traefik.http.routers.hola-web.entrypoints: websecure
      traefik.http.routers.hola-web.tls: "true"
      traefik.http.routers.hola-web.tls.certresolver: le
      traefik.http.services.hola-web.loadbalancer.server.port: "80"

volumes:
  hola-data:

networks:
  default:
    name: hola
