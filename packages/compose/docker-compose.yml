version: "3.9"

x-common-labels: &common-labels
  traefik.enable: "true"

services:
  traefik:
    image: traefik:v3.1
    container_name: traefik
    command:
      - --api.dashboard=true
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --entrypoints.web.address=:${TRAEFIK_HTTP_PORT:-80}
      - --entrypoints.websecure.address=:${TRAEFIK_HTTPS_PORT:-443}
      - --providers.file.directory=/etc/traefik/dynamic
      - --providers.file.watch=true
      # Let's Encrypt (HTTP-01 challenge)
      - --certificatesresolvers.le.acme.email=${LETSENCRYPT_EMAIL}
      - --certificatesresolvers.le.acme.storage=/letsencrypt/acme.json
      - --certificatesresolvers.le.acme.httpchallenge=true
      - --certificatesresolvers.le.acme.httpchallenge.entrypoint=web
    ports:
      - "${TRAEFIK_HTTP_PORT:-80}:80"
      - "${TRAEFIK_HTTPS_PORT:-443}:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./traefik/dynamic:/etc/traefik/dynamic:ro
      - ./traefik/acme:/letsencrypt
    labels:
      <<: *common-labels
      # Dashboard over HTTP
      traefik.http.routers.traefik-http.rule: Host(`${TRAEFIK_DASHBOARD_DOMAIN}`)
      traefik.http.routers.traefik-http.service: api@internal
      traefik.http.routers.traefik-http.entrypoints: web
      # Dashboard over HTTPS (with LE)
      traefik.http.routers.traefik-https.rule: Host(`${TRAEFIK_DASHBOARD_DOMAIN}`)
      traefik.http.routers.traefik-https.entrypoints: websecure
      traefik.http.routers.traefik-https.service: api@internal
      traefik.http.routers.traefik-https.tls: true
      traefik.http.routers.traefik-https.tls.certresolver: le

  server:
    image: hola/server:latest
    container_name: hola-server
    depends_on:
      - traefik
    environment:
      - NODE_ENV=production
    labels:
      <<: *common-labels
      # HTTP router (redirect to HTTPS)
      traefik.http.routers.hola-server-http.rule: Host(`${SERVER_DOMAIN}`)
      traefik.http.routers.hola-server-http.entrypoints: web
      traefik.http.routers.hola-server-http.middlewares: hola-redirect@docker
      # HTTPS router
      traefik.http.routers.hola-server-https.rule: Host(`${SERVER_DOMAIN}`)
      traefik.http.routers.hola-server-https.entrypoints: websecure
      traefik.http.routers.hola-server-https.tls: true
      traefik.http.routers.hola-server-https.tls.certresolver: le
      # Service port
      traefik.http.services.hola-server.loadbalancer.server.port: "3001"

  web:
    image: hola/web:latest
    container_name: hola-web
    depends_on:
      - traefik
      - server
    labels:
      <<: *common-labels
      # HTTP router (redirect to HTTPS)
      traefik.http.routers.hola-web-http.rule: Host(`${WEB_DOMAIN}`)
      traefik.http.routers.hola-web-http.entrypoints: web
      traefik.http.routers.hola-web-http.middlewares: hola-redirect@docker
      # HTTPS router
      traefik.http.routers.hola-web-https.rule: Host(`${WEB_DOMAIN}`)
      traefik.http.routers.hola-web-https.entrypoints: websecure
      traefik.http.routers.hola-web-https.tls: true
      traefik.http.routers.hola-web-https.tls.certresolver: le
      # Service port (production image expected to serve on 3000)
      traefik.http.services.hola-web.loadbalancer.server.port: "3000"

      # Shared middleware for HTTP->HTTPS redirect
      traefik.http.middlewares.hola-redirect.redirectscheme.scheme: https
      traefik.http.middlewares.hola-redirect.redirectscheme.permanent: "true"

networks:
  default:
    name: hola
