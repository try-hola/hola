# Hola production stack: Traefik (ingress/TLS) + web (SPA, single origin) + API server.
#
# The API server orchestrates app deployments via the Docker socket and emits
# Traefik dynamic configuration into its data volume, which Traefik reads through
# its file provider, so deployed apps become routable at <app>.<HOLA_BASE_DOMAIN>.
# The platform's OWN routes (the UI, the Traefik dashboard, and the Authentik login
# UI) are emitted the same way (core.yml) — so Traefik uses the file provider ONLY
# and needs neither the Docker provider nor a mounted Docker socket.
#
#   cp .env.example .env   # then edit
#   ./scripts/install.sh   # or: docker compose -f docker-compose.yml up -d --build
#
# This is the PRODUCTION stack. For local development use the dev override:
#   HOLA_DEV=1 ./scripts/up.sh
#   # or: docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d

services:
  # Ensure the Traefik file-provider directory exists in the shared data volume
  # BEFORE Traefik starts. Traefik mounts hola-data READ-ONLY and its file provider
  # fails permanently if the watched directory is missing at boot — it cannot watch
  # a nonexistent path and never retries. On a cold start where Traefik wins the race
  # against the server (which creates the dir), Traefik would load ZERO routers and
  # 404 every host until manually restarted. This oneshot creates the dir read-write
  # and exits; it reuses the traefik image so it adds no extra pull.
  traefik-init:
    image: traefik:v3.5
    container_name: traefik-init
    entrypoint: ["/bin/sh", "-c", "mkdir -p /data/runtime/traefik"]
    restart: "no"
    volumes:
      - hola-data:/data

  traefik:
    image: traefik:v3.5
    container_name: traefik
    restart: unless-stopped
    depends_on:
      traefik-init:
        condition: service_completed_successfully
    command:
      # --api enables the built-in api@internal service; the Hola server emits a
      # file-provider router for it (core.yml) at TRAEFIK_DASHBOARD_DOMAIN.
      - --api=true
      - --api.dashboard=true
      # File provider ONLY — no Docker provider, no Docker socket. Both the
      # server-emitted app routes AND the platform's core routes (UI, dashboard,
      # Authentik) land in this watched directory (shared data volume).
      - --providers.file.directory=/data/runtime/traefik
      - --providers.file.watch=true
      - --entrypoints.web.address=:80
      - --entrypoints.websecure.address=:443
      # Default cert resolver for HTTPS so server-emitted app routes (Traefik
      # file provider, which set `tls: {}` without a resolver) get Let's Encrypt
      # certificates automatically — every deployed app at <app>.<base-domain>
      # is served over valid TLS, not Traefik's self-signed default.
      # Default resolver for ALL websecure routers (UI, dashboard, auth, and the
      # server-emitted app routes) so none need a per-router certresolver label.
      # The DNS-01 overlay (docker-compose.dns01.yml) adds wildcard domains here.
      - --entrypoints.websecure.http.tls.certresolver=le
      # Global HTTP -> HTTPS redirect at the entrypoint (no per-service middleware).
      - --entrypoints.web.http.redirections.entrypoint.to=websecure
      - --entrypoints.web.http.redirections.entrypoint.scheme=https
      # Let's Encrypt (HTTP-01). Requires public, resolvable domains.
      - --certificatesresolvers.le.acme.email=${LETSENCRYPT_EMAIL}
      - --certificatesresolvers.le.acme.storage=/letsencrypt/acme.json
      - --certificatesresolvers.le.acme.httpchallenge=true
      - --certificatesresolvers.le.acme.httpchallenge.entrypoint=web
    ports:
      - "${TRAEFIK_HTTP_PORT:-80}:80"
      - "${TRAEFIK_HTTPS_PORT:-443}:443"
    volumes:
      # No Docker socket: Traefik discovers nothing from Docker; all routing comes
      # from the file provider below (server-emitted app routes + core.yml).
      - hola-data:/data:ro
      - ./traefik/acme:/letsencrypt

  server:
    # Prebuilt, version-pinned image published by the CLI release workflow.
    # HOLA_VERSION is exported by scripts/_common.sh from the bundle's VERSION
    # file (a source checkout has none, so it falls back to :latest). Build the
    # image locally instead with the opt-in overlay: HOLA_BUILD=1 ./scripts/up.sh --build.
    image: ghcr.io/try-hola/server:${HOLA_VERSION:-latest}
    container_name: hola-server
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      # The mock-data subsystem (src/mock-data) defaults ON unless USE_MOCK_DATA is
      # exactly "false", so it stays active even with NODE_ENV=production — which
      # simulates deploys (fake logs, random job "errors") instead of running real
      # `docker compose`. Force it off for the production stack.
      - USE_MOCK_DATA=false
      - HOLA_DATA_DIR=/data
      # The running version, surfaced in the dashboard / system status. Exported by
      # scripts/_common.sh from the bundle's VERSION file (same value as the image tag).
      - HOLA_VERSION=${HOLA_VERSION:-}
      # Platform hosts the server emits Traefik file-provider routes for (core.yml):
      # the UI itself, the Traefik dashboard, and (when SSO is on) the Authentik UI.
      # These replace the Docker-label routers Traefik used to discover.
      - HOLA_DOMAIN=${HOLA_DOMAIN}
      - TRAEFIK_DASHBOARD_DOMAIN=${TRAEFIK_DASHBOARD_DOMAIN}
      - HOLA_AUTHENTIK_DOMAIN=${HOLA_AUTHENTIK_DOMAIN:-}
      - HOLA_USE_AUTH=${HOLA_USE_AUTH:-true}
      # Optional fixed admin key; if unset, the server generates one on first boot
      # and writes it to /data/config/admin-api-key (see README).
      - HOLA_API_KEY=${HOLA_API_KEY:-}
      # Base domain that deployed apps are exposed under (e.g. gitea.${HOLA_BASE_DOMAIN}).
      - HOLA_BASE_DOMAIN=${HOLA_BASE_DOMAIN:-local.hola}
      # Remote app catalog (JSON). The turnkey default lives in .env.example; blank
      # disables the catalog. See README "App catalog".
      - HOLA_CATALOG_URL=${HOLA_CATALOG_URL:-}
      # Auth/SSO: when HOLA_AUTH_MODE=authentik the server provisions per-app auth
      # (OIDC clients, etc.) against the Authentik stack below. `none` disables it.
      # See README "Authentication & SSO". URL is the internal compose DNS name;
      # PUBLIC_URL/API_TOKEN are written into .env by scripts/install.sh.
      - HOLA_AUTH_MODE=${HOLA_AUTH_MODE:-none}
      - HOLA_AUTHENTIK_URL=${HOLA_AUTHENTIK_URL:-http://authentik-server:9000}
      - HOLA_AUTHENTIK_PUBLIC_URL=${HOLA_AUTHENTIK_PUBLIC_URL:-}
      # The server self-bootstraps a least-privilege scoped token from the admin
      # bootstrap token at startup; provisioning then runs as a non-superuser
      # service account. Set HOLA_AUTHENTIK_API_TOKEN to pin a pre-made scoped token instead.
      - HOLA_AUTHENTIK_BOOTSTRAP_TOKEN=${AUTHENTIK_BOOTSTRAP_TOKEN:-}
      - HOLA_AUTHENTIK_API_TOKEN=${HOLA_AUTHENTIK_API_TOKEN:-}
      # Dashboard SSO: with HOLA_AUTH_MODE=authentik the server self-provisions a
      # public OIDC client for the dashboard and validates its access tokens. To
      # use an external IdP instead, set HOLA_OIDC_ISSUER + HOLA_OIDC_CLIENT_ID
      # (and the client's redirect URI must be https://${HOLA_DOMAIN}/auth/callback).
      - HOLA_OIDC_ISSUER=${HOLA_OIDC_ISSUER:-}
      - HOLA_OIDC_CLIENT_ID=${HOLA_OIDC_CLIENT_ID:-}
      - HOLA_OIDC_AUDIENCE=${HOLA_OIDC_AUDIENCE:-}
      - HOLA_OIDC_ADMIN_GROUP=${HOLA_OIDC_ADMIN_GROUP:-}
      # Optional named admin: provisioned into hola-admins with a one-time
      # password-setup recovery link logged at startup (see .env.example).
      - HOLA_ADMIN_EMAIL=${HOLA_ADMIN_EMAIL:-}
      - HOLA_ADMIN_USERNAME=${HOLA_ADMIN_USERNAME:-}
      - HOLA_ADMIN_NAME=${HOLA_ADMIN_NAME:-}
      # Base DN of the shared LDAP directory (for native-ldap apps); host/port
      # default to the authentik-ldap outpost service.
      - HOLA_AUTHENTIK_LDAP_BASE_DN=${HOLA_AUTHENTIK_LDAP_BASE_DN:-dc=hola,dc=internal}
      # Per-app data root (default /srv/hola/apps). Apps declare persistent
      # storage under the ${HOLA_APP_DATA} token (enforced by the compose
      # validator); the server resolves it to <HOLA_APPS_BIND_ROOT>/<deploymentId>/
      # so all of an app's data lives in one backup-friendly host folder. The
      # path MUST be identity-mounted below (same path on host and in-container)
      # because the daemon resolves bind sources on the host.
      - HOLA_APPS_BIND_ROOT=${HOLA_APPS_BIND_ROOT:-/srv/hola/apps}
      # Platform defaults applied to every deployed app's compose (the app wins
      # for fill-if-absent fields; hardening is additive). Restart policy, log
      # rotation, and no-new-privileges are on by default; TZ and resource limits
      # are off unless set. See packages/server/src/config/compose-defaults.ts.
      - HOLA_DEFAULT_RESTART_POLICY=${HOLA_DEFAULT_RESTART_POLICY:-unless-stopped}
      - HOLA_DEFAULT_LOG_MAX_SIZE=${HOLA_DEFAULT_LOG_MAX_SIZE:-10m}
      - HOLA_DEFAULT_LOG_MAX_FILE=${HOLA_DEFAULT_LOG_MAX_FILE:-3}
      - HOLA_DEFAULT_NO_NEW_PRIVILEGES=${HOLA_DEFAULT_NO_NEW_PRIVILEGES:-true}
      - HOLA_DEFAULT_TZ=${HOLA_DEFAULT_TZ:-}
      - HOLA_DEFAULT_MEM_LIMIT=${HOLA_DEFAULT_MEM_LIMIT:-}
      - HOLA_DEFAULT_CPUS=${HOLA_DEFAULT_CPUS:-}
    volumes:
      # Orchestrate deployments by talking to the host Docker engine.
      # SECURITY: this grants control of the host's Docker - see README.
      - /var/run/docker.sock:/var/run/docker.sock
      - hola-data:/data
      # Identity mount for the per-app bind root (see HOLA_APPS_BIND_ROOT). The
      # source and target are the SAME host path so paths the server creates
      # match what the Docker daemon binds into app containers. No-op when the
      # var is blank (defaults to a host dir that simply goes unused).
      - ${HOLA_APPS_BIND_ROOT:-/srv/hola/apps}:${HOLA_APPS_BIND_ROOT:-/srv/hola/apps}
    # Internal only: reached through the web container's /api proxy. Not routed by
    # Traefik (no Docker provider; only core.yml/app routes are served).

  web:
    # Prebuilt, version-pinned image (see the server service above for HOLA_VERSION
    # and the HOLA_BUILD=1 local-build overlay).
    image: ghcr.io/try-hola/web:${HOLA_VERSION:-latest}
    container_name: hola-web
    restart: unless-stopped
    depends_on:
      - server
    # Routed by the server-emitted core.yml (Host=${HOLA_DOMAIN} -> hola-web:80),
    # not Docker labels — Traefik has no Docker provider.

  # --- Authentik (SSO platform) -------------------------------------------
  # Opt-in: only started when the `authentik` compose profile is active
  # (scripts/install.sh sets COMPOSE_PROFILES=authentik when HOLA_AUTH_MODE=authentik).
  # Server + worker + Postgres. Redis is NOT required (removed in Authentik 2025.10).
  # The proxy outpost is embedded in authentik-server; the LDAP outpost (PR4) is added
  # separately. We deliberately do NOT mount the Docker socket here — Hola runs any
  # outposts as its own compose services rather than letting Authentik spawn them.
  authentik-postgres:
    image: docker.io/library/postgres:16-alpine
    container_name: authentik-postgres
    profiles: [authentik]
    restart: unless-stopped
    environment:
      POSTGRES_USER: authentik
      # Populated by scripts/install.sh when HOLA_AUTH_MODE=authentik. (Plain `:-`
      # rather than `:?` so the default no-auth stack interpolates without these set.)
      POSTGRES_PASSWORD: ${AUTHENTIK_PG_PASS:-}
      POSTGRES_DB: authentik
    volumes:
      - authentik-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -d authentik -U authentik"]
      interval: 10s
      timeout: 5s
      retries: 5

  authentik-server:
    image: ghcr.io/goauthentik/server:2025.10
    container_name: authentik-server
    profiles: [authentik]
    restart: unless-stopped
    command: server
    environment:
      AUTHENTIK_SECRET_KEY: ${AUTHENTIK_SECRET_KEY:-}
      AUTHENTIK_POSTGRESQL__HOST: authentik-postgres
      AUTHENTIK_POSTGRESQL__USER: authentik
      AUTHENTIK_POSTGRESQL__NAME: authentik
      AUTHENTIK_POSTGRESQL__PASSWORD: ${AUTHENTIK_PG_PASS}
      # Bootstrap a usable admin + API token on first boot (no interactive setup).
      # The token doubles as HOLA_AUTHENTIK_API_TOKEN for the server's provisioner.
      AUTHENTIK_BOOTSTRAP_PASSWORD: ${AUTHENTIK_BOOTSTRAP_PASSWORD:-}
      AUTHENTIK_BOOTSTRAP_TOKEN: ${AUTHENTIK_BOOTSTRAP_TOKEN:-}
      AUTHENTIK_BOOTSTRAP_EMAIL: ${AUTHENTIK_BOOTSTRAP_EMAIL:-admin@example.com}
    depends_on:
      authentik-postgres:
        condition: service_healthy
    volumes:
      - authentik-media:/media
      - authentik-templates:/templates
    # Routed by the server-emitted core.yml (Host=${HOLA_AUTHENTIK_DOMAIN} ->
    # authentik-server:9000) when HOLA_AUTH_MODE=authentik — not Docker labels.

  authentik-worker:
    image: ghcr.io/goauthentik/server:2025.10
    container_name: authentik-worker
    profiles: [authentik]
    restart: unless-stopped
    command: worker
    environment:
      AUTHENTIK_SECRET_KEY: ${AUTHENTIK_SECRET_KEY}
      AUTHENTIK_POSTGRESQL__HOST: authentik-postgres
      AUTHENTIK_POSTGRESQL__USER: authentik
      AUTHENTIK_POSTGRESQL__NAME: authentik
      AUTHENTIK_POSTGRESQL__PASSWORD: ${AUTHENTIK_PG_PASS}
      # The WORKER runs the bootstrap that creates the akadmin user and the API
      # token from AUTHENTIK_BOOTSTRAP_TOKEN. Without these here the token is never
      # created, and the server's provisioner credential (same value) is rejected
      # by Authentik (403), failing every SSO deploy. Must match authentik-server.
      AUTHENTIK_BOOTSTRAP_PASSWORD: ${AUTHENTIK_BOOTSTRAP_PASSWORD:-}
      AUTHENTIK_BOOTSTRAP_TOKEN: ${AUTHENTIK_BOOTSTRAP_TOKEN:-}
      AUTHENTIK_BOOTSTRAP_EMAIL: ${AUTHENTIK_BOOTSTRAP_EMAIL:-admin@example.com}
    depends_on:
      authentik-postgres:
        condition: service_healthy
    volumes:
      - authentik-media:/media
      - authentik-templates:/templates
      - authentik-certs:/certs

  # LDAP outpost — serves the shared directory that `native-ldap` apps bind to,
  # reachable internally on the `hola` network at authentik-ldap:3389. Requires a
  # one-time setup: create an LDAP provider + outpost in Authentik and copy the
  # outpost token into AUTHENTIK_LDAP_OUTPOST_TOKEN (see README "Authentication & SSO").
  authentik-ldap:
    image: ghcr.io/goauthentik/ldap:2025.10
    container_name: authentik-ldap
    profiles: [authentik]
    restart: unless-stopped
    environment:
      AUTHENTIK_HOST: http://authentik-server:9000
      AUTHENTIK_INSECURE: "true"
      AUTHENTIK_TOKEN: ${AUTHENTIK_LDAP_OUTPOST_TOKEN:-}
    depends_on:
      - authentik-server

volumes:
  hola-data:
  authentik-postgres:
  authentik-media:
  authentik-templates:
  authentik-certs:

networks:
  default:
    name: hola
