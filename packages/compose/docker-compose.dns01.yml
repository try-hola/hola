# DNS-01 TLS overlay (opt-in) — for PRIVATE / homelab hosts that are NOT reachable
# from the internet on :80, where Let's Encrypt's HTTP-01 challenge can't validate.
#
# DNS-01 proves domain control by writing a TXT record via your DNS provider's API,
# so the host itself never needs an inbound port open. It also supports WILDCARD
# certs, so a single cert covers the UI, the Traefik dashboard, the Authentik login
# UI, and every deployed app: *.${HOLA_BASE_DOMAIN}.
#
# scripts/up.sh auto-includes this file when ACME_DNS_PROVIDER is set in .env.
# Manually it's:
#   docker compose -f docker-compose.yml -f docker-compose.dns01.yml up -d
#
# Configure ACME_DNS_PROVIDER + the provider credentials in .env. See README
# "Private/homelab TLS (DNS-01)".
services:
  traefik:
    # `command` REPLACES the base command (compose does not merge lists), so the
    # full set is restated here with DNS-01 + the wildcard request.
    command:
      - --api=true
      - --api.dashboard=true
      # File provider ONLY (no Docker provider/socket) — see docker-compose.yml.
      - --providers.file.directory=/data/runtime/traefik
      - --providers.file.watch=true
      - --entrypoints.web.address=:80
      - --entrypoints.websecure.address=:443
      - --entrypoints.websecure.http.tls.certresolver=le
      # One wildcard cert for the whole base domain (UI, dashboard, auth, and every
      # app route — all served from the single *.${HOLA_BASE_DOMAIN} cert).
      # NOTE: Traefik v3 does NOT proactively request an entrypoint-level
      # `tls.domains` when routers emit an empty `tls: {}` — it only obtains the
      # wildcard when a ROUTER carries `tls.domains`. So the actual proactive
      # request is driven by the server stamping the wildcard on its emitted
      # routers (HOLA_TLS_CERT_RESOLVER on the server service, below). This
      # entrypoint default stays as the resolver fallback for any router.
      - --entrypoints.websecure.http.tls.domains[0].main=${HOLA_BASE_DOMAIN}
      - --entrypoints.websecure.http.tls.domains[0].sans=*.${HOLA_BASE_DOMAIN}
      - --entrypoints.web.http.redirections.entrypoint.to=websecure
      - --entrypoints.web.http.redirections.entrypoint.scheme=https
      - --certificatesresolvers.le.acme.email=${LETSENCRYPT_EMAIL}
      - --certificatesresolvers.le.acme.storage=/letsencrypt/acme.json
      # ACME CA directory — defaults to production; set ACME_CA_SERVER to the
      # staging directory to test wildcard issuance without prod rate limits.
      # Staging certs are untrusted; start from a fresh acme.json when switching.
      - --certificatesresolvers.le.acme.caserver=${ACME_CA_SERVER:-https://acme-v02.api.letsencrypt.org/directory}
      # DNS-01 instead of HTTP-01 — no inbound :80 reachability required.
      - --certificatesresolvers.le.acme.dnschallenge=true
      - --certificatesresolvers.le.acme.dnschallenge.provider=${ACME_DNS_PROVIDER}
      # Split-horizon / DNS-redirection safety. lego's default propagation check
      # queries the zone's AUTHORITATIVE nameservers directly on :53; on homelab
      # networks that redirect/intercept outbound DNS (UniFi/pfSense "redirect all
      # DNS to the gateway", NAT hairpin on :53) those queries are REFUSED and
      # issuance hangs until it times out — the classic "needed a separate ACME
      # container" failure. Skip the authoritative-NS check and verify against
      # public recursive resolvers instead (override ACME_DNS_RESOLVERS in .env).
      - --certificatesresolvers.le.acme.dnschallenge.propagation.disableanschecks=true
      - --certificatesresolvers.le.acme.dnschallenge.resolvers=${ACME_DNS_RESOLVERS:-1.1.1.1:53,9.9.9.9:53}
    environment:
      # Credentials for the DNS provider's API. lego reads only the vars the chosen
      # ACME_DNS_PROVIDER needs; the others stay empty and are ignored.
      # AWS Route 53 (ACME_DNS_PROVIDER=route53):
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_REGION: ${AWS_REGION:-}
      AWS_HOSTED_ZONE_ID: ${AWS_HOSTED_ZONE_ID:-}
      # Cloudflare (ACME_DNS_PROVIDER=cloudflare):
      CF_DNS_API_TOKEN: ${CF_DNS_API_TOKEN:-}

  # In wildcard/DNS-01 mode the server must stamp the wildcard `tls.domains` on
  # every router it emits — an entrypoint-level `tls.domains` is not proactively
  # resolved when routers carry `tls: {}` (see the entrypoint note above and
  # routing.ts `routerTlsBlock`). The value is the ACME resolver name from the
  # traefik command (`le`). Absent (HTTP-01 path) → routers stay `tls: {}`.
  server:
    environment:
      HOLA_TLS_CERT_RESOLVER: le
