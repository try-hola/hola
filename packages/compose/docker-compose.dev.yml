# Local development overlay — OPT-IN, layered on top of docker-compose.yml.
#
# Named *.dev.yml (not *.override.yml) so `docker compose` never auto-merges it;
# production stays the default. Enable it with `HOLA_DEV=1 ./scripts/up.sh` or
# `docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d`.
#
# Runs the monorepo with Bun dev servers (hot reload), HTTP only (no TLS/LE),
# and a single dev domain. Web (Vite, :5173) serves the SPA and proxies /api to
# the server container. Requires entries in /etc/hosts for the dev domains.

services:
  traefik:
    command:
      - --api.dashboard=true
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --providers.file.directory=/data/runtime/traefik
      - --providers.file.watch=true
      - --entrypoints.web.address=:80
    labels:
      # Dashboard over plain HTTP in development.
      traefik.http.routers.traefik.entrypoints: web
      traefik.http.routers.traefik.tls: "false"

  server:
    build: !reset null
    image: oven/bun:1
    container_name: hola-server-dev
    working_dir: /app/packages/server
    command: ["bun", "run", "dev"]
    environment:
      - NODE_ENV=development
      - HOLA_DATA_DIR=/data
    volumes:
      - ../..:/app:cached
      - hola-data:/data

  web:
    build: !reset null
    image: oven/bun:1
    container_name: hola-web-dev
    working_dir: /app/packages/web
    command: ["bun", "run", "dev", "--host", "0.0.0.0"]
    environment:
      - HOLA_API_PROXY_TARGET=http://hola-server:3001
    volumes:
      - ../..:/app:cached
    labels:
      traefik.enable: "true"
      traefik.http.routers.hola-web.rule: Host(`${HOLA_DOMAIN}`)
      traefik.http.routers.hola-web.entrypoints: web
      traefik.http.routers.hola-web.tls: "false"
      traefik.http.services.hola-web.loadbalancer.server.port: "5173"
