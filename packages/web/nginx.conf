# Serve the Hola SPA and proxy /api to the API server (single origin).
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # SPA client-side routing: fall back to index.html.
  location / {
    try_files $uri $uri/ /index.html;
  }

  # API + SSE proxy. The server container is reachable as "hola-server".
  location /api/ {
    proxy_pass http://hola-server:3001;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Server-Sent Events: stream immediately, never buffer, no idle timeout.
    proxy_set_header Connection '';
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 3600s;
    chunked_transfer_encoding off;
  }
}
