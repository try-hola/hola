openapi: 3.1.0
info:
  title: Hola API
  version: "1.0.0"
servers:
  - url: http://localhost:{port}
    description: Local server
    variables:
      port:
        default: "3000"
paths:
  /api/apps:
    post:
      summary: Deploy an application
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                appName:
                  type: string
                  description: Name of the application to deploy
                version:
                  type: string
                  description: Version of the application to deploy (default is "latest")
              required:
                - appName
      responses:
        "200":
          description: App deployment initiated (SSE stream)
          content:
            text/event-stream:
              schema:
                type: string
        "400":
          description: Missing app name
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
    get:
      summary: List all deployed applications
      responses:
        "200":
          description: List of applications retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  apps:
                    type: array
                    items:
                      type: string
        "500":
          description: Failed to list applications
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  details:
                    type: string

  /api/apps/deploy:
    post:
      summary: Alternative endpoint to deploy an application
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                appName:
                  type: string
                  description: Name of the application to deploy
                version:
                  type: string
                  description: Version of the application to deploy (default is "latest")
              required:
                - appName
      responses:
        "200":
          description: App deployment initiated (SSE stream)
          content:
            text/event-stream:
              schema:
                type: string
        "400":
          description: Missing app name
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string

  /api/apps/{appName}/details:
    get:
      summary: Get details about a deployed application
      parameters:
        - name: appName
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Application details retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  appName:
                    type: string
                  status:
                    type: string
                  config:
                    type: object
                  files:
                    type: array
                    items:
                      type: string
        "404":
          description: Application not found
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
        "500":
          description: Failed to get application details
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  details:
                    type: string

  /api/apps/{appName}/upgrade:
    post:
      summary: Upgrade an application to a new version
      parameters:
        - name: appName
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                version:
                  type: string
                  description: Version to upgrade to (default is "latest")
      responses:
        "200":
          description: Upgrade initiated (SSE stream)
          content:
            text/event-stream:
              schema:
                type: string
        "500":
          description: Failed to upgrade application
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string

  /api/apps/{appName}:
    delete:
      summary: Remove a deployed application
      parameters:
        - name: appName
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Application removal initiated (SSE stream)
          content:
            text/event-stream:
              schema:
                type: string
        "500":
          description: Failed to remove application
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string

  /api/apps/{appName}/files:
    post:
      summary: Upload a file for an application
      parameters:
        - name: appName
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
                filePath:
                  type: string
              required:
                - file
                - filePath
      responses:
        "201":
          description: File uploaded successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  path:
                    type: string
        "400":
          description: Missing fields or file / invalid filePath
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
        "500":
          description: File upload failed
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    
    get:
      summary: List all files for an application
      parameters:
        - name: appName
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Files retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  files:
                    type: array
                    items:
                      type: object
                      properties:
                        path:
                          type: string
                        name:
                          type: string
                  count:
                    type: integer
        "400":
          description: Invalid app name
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
        "500":
          description: Failed to list files
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string

  /api/apps/{appName}/files/{filePath}:
    get:
      summary: Download a specific file
      parameters:
        - name: appName
          in: path
          required: true
          schema:
            type: string
        - name: filePath
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: File content
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        "400":
          description: Invalid app name
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
        "404":
          description: File not found
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
    
    delete:
      summary: Delete a specific file
      parameters:
        - name: appName
          in: path
          required: true
          schema:
            type: string
        - name: filePath
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: File deleted successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
        "400":
          description: Invalid app name or path traversal detected
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
        "404":
          description: File not found
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
        "500":
          description: Failed to delete file
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string

  /api/apps/{appName}/start:
    post:
      summary: Start an application
      parameters:
        - name: appName
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Application start initiated (SSE stream)
          content:
            text/event-stream:
              schema:
                type: string
        "500":
          description: Failed to start application
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string

  /api/apps/{appName}/stop:
    post:
      summary: Stop an application
      parameters:
        - name: appName
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Application stop initiated (SSE stream)
          content:
            text/event-stream:
              schema:
                type: string
        "500":
          description: Failed to stop application
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
